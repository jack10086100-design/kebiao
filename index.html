*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;background:#eef2f7;color:#1f2937;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:680px;margin:0 auto;padding:14px 14px 60px}
header{background:linear-gradient(135deg,#2f6fed,#5b8def);color:#fff;border-radius:16px;padding:18px 18px 14px;margin-bottom:12px;box-shadow:0 4px 12px rgba(47,111,237,.25)}

.sub{font-size:12px;opacity:.92;margin-top:5px}
.panel{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(15,23,42,.06)}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.row:last-child{margin-bottom:0}
input[type=text],input[type=date],select{flex:1;min-width:0;padding:10px 12px;border:1px solid #d7dde8;border-radius:10px;font-size:14px;background:#f8fafc;color:#1f2937;outline:none}
input[type=text]:focus,input[type=date]:focus,select:focus{border-color:#2f6fed}
button{padding:9px 13px;border:none;border-radius:10px;background:#eef2f8;color:#334155;font-size:13px;cursor:pointer;transition:background .15s}
button:hover{background:#e2e8f2}
button.primary{background:#2f6fed;color:#fff;font-weight:600}
button.primary:hover{background:#2560d8}
button.danger{background:#fee2e2;color:#b91c1c}
button.ok{background:#dcfce7;color:#15803d}
button.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.tabs{display:flex;gap:6px;padding:6px;background:#f1f5fa;border-radius:12px}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;background:transparent;color:#64748b;font-size:14px}
.tab.active{background:#2f6fed;color:#fff;font-weight:600}
.result-info{margin:4px 2px 10px;font-size:13px;color:#475569;line-height:1.7}
.day-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.day-title{font-size:16px;font-weight:700;flex:1}
.navbtn{padding:6px 10px;font-size:12px}
.card{background:#fff;border:1px solid #e6ebf3;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.card.cancelled{opacity:.6;background:#fafbfc}
.card .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.time-chip{background:#eef4ff;color:#2f6fed;font-weight:700;font-size:13px;padding:3px 8px;border-radius:7px;font-variant-numeric:tabular-nums}
.period-chip{background:#f1f5fa;color:#64748b;font-size:12px;padding:3px 7px;border-radius:7px}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600}
.t-理论课{background:#e0f2fe;color:#0369a1}
.t-见习{background:#dcfce7;color:#15803d}
.t-CBL{background:#ffedd5;color:#c2410c}
.t-讨论课{background:#f3e8ff;color:#7e22ce}
.t-PBL{background:#fef9c3;color:#a16207}
.t-床边教学,.t-床旁教学{background:#ccfbf1;color:#0f766e}
.t-案例教学{background:#ffe4e6;color:#be123c}
.t-考试{background:#fee2e2;color:#b91c1c}
.t-其他{background:#f1f5f9;color:#64748b}
.t-调课{background:#f1f5f9;color:#94a3b8}
.badge.s-正常{background:#dcfce7;color:#15803d}
.badge.s-已修改{background:#ffedd5;color:#c2410c}
.badge.s-已取消{background:#fee2e2;color:#b91c1c}
.badge.s-用户补充{background:#ede9fe;color:#6d28d9}
.course-name{font-size:16px;font-weight:700;margin-bottom:5px}
.course-name .strike{text-decoration:line-through;color:#94a3b8}
.meta{font-size:13px;color:#475569;margin-bottom:4px}
.meta .lbl{color:#94a3b8}
.content{font-size:13px;color:#64748b;margin-bottom:8px;background:#f8fafc;border-radius:8px;padding:7px 9px}
.content.empty{color:#94a3b8;font-style:italic}
.card-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.free-block{background:#ecfdf5;color:#047857;font-size:13px;border-radius:8px;padding:7px 9px;margin-top:8px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-box{background:#f8fafc;border:1px solid #e6ebf3;border-radius:10px;padding:10px}
.stat-box .k{font-size:12px;color:#94a3b8}
.stat-box .v{font-size:15px;font-weight:700;color:#1f2937;margin-top:3px}
.week-day{border:1px solid #e6ebf3;border-radius:12px;margin-bottom:10px;overflow:hidden}
.week-day .wd-head{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid #e6ebf3;cursor:pointer}
.week-day .wd-head .d{font-weight:700;font-size:14px}
.week-day .wd-head .cnt{font-size:12px;color:#94a3b8;margin-left:auto}
.wd-body{padding:8px 10px}
.wd-item{font-size:13px;padding:4px 0;border-bottom:1px dashed #eef2f7;display:flex;gap:6px;align-items:baseline}
.wd-item:last-child{border-bottom:none}
.wd-item .t{color:#2f6fed;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.wd-item .c{color:#1f2937}
.wd-item .badge{flex-shrink:0}
.wd-empty{color:#c3ccd9;font-size:13px;padding:6px 0}
.wd-today .wd-head{background:#eef4ff}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:16px;max-width:540px;width:100%;padding:16px;max-height:88vh;overflow:auto}
.modal-title{font-size:16px;font-weight:700;margin-bottom:12px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:#64748b;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid #d7dde8;border-radius:9px;font-size:14px;background:#f8fafc}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.conflict-box{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px;margin:10px 0;font-size:13px;color:#b91c1c}
.hint{font-size:12px;color:#94a3b8;margin-top:6px}
.hide{display:none}

</head>

  <header>

  </header>

  <section class="panel">
    <div class="row">
      <input type="text" id="q" placeholder="试试：明天 / 9月28日 / 周三 / 第5周周三 / 儿科 / A301">
      <button class="primary" id="qBtn">查询</button>
    </div>
    <div class="row">
      <button id="btnToday">今天</button>
      <button id="btnTomorrow">明天</button>
      <button id="btnWeek">本周</button>
      <input type="date" id="dateInput">
    </div>
    <div class="hint">支持：今天/明天/后天/昨天 · X月X日 · 周X/这周X/下周一 · 周末 · 第N周周三 · 上午/下午 · 课程/教室/教师关键词</div>
  </section>

  <div id="resultInfo" class="result-info"></div>

  <section class="panel tabs">
    <button class="tab active" data-tab="day">当日课表</button>
    <button class="tab" data-tab="week">整周课表</button>
    <button class="tab" data-tab="add">补充安排</button>
    <button class="tab" data-tab="stats">本周统计</button>
  </section>

  <main id="main"></main>
</div>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function parseDateStr(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtCn(d){return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WEEK_CN[d.getDay()];}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function weekMonday(d){const r=new Date(d.getFullYear(),d.getMonth(),d.getDate());r.setDate(r.getDate()-((r.getDay()+6)%7));return r;}
function cn2idx(ch){return '一二三四五六日天'.indexOf(ch);}
function parseTimeRange(t){
  if(!t)return null;
  const m=String(t).match(/(\d{1,2}):(\d{2})\s*[-–—~至]\s*(\d{1,2}):(\d{2})/);
  if(!m)return null;
  const s=(+m[1])*60+(+m[2]),e=(+m[3])*60+(+m[4]);
  return e>s?[s,e]:null;
}
function startMin(r){const tr=parseTimeRange(r.time);return tr?tr[0]:9999;}
function isFree(r){return r.type==='调课'&&(r.time==='—'||/无课|调课/.test(r.content||''));}
function isActive(r){return r.status!=='已取消'&&!isFree(r);}

/* ---------- 用户修改层 ---------- */
function loadMods(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch(e){return [];}}
function saveMods(){localStorage.setItem(STORAGE_KEY,JSON.stringify(mods.filter(m=>!m.preset)));}
let mods=[...PRESET_MODS, ...loadMods()];

function effectiveRecords(){
  const byId=new Map();
  BASE_DATA.records.forEach(r=>byId.set(r.id,Object.assign({},r)));
  mods.forEach(m=>{
    if(m.action==='restore'){
      const base=BASE_DATA.records.find(x=>x.id===m.targetId);
      const r=byId.get(m.targetId);
      if(r&&base){byId.set(m.targetId,Object.assign({},base));}
    }else if(m.action==='cancel'){
      const r=byId.get(m.targetId);
      if(r){r.status='已取消';r.note=m.note||'';}
    }else if(m.action==='edit'){
      const r=byId.get(m.targetId);
      if(r){Object.assign(r,m.fields);r.status='已修改';r.note=m.note||'';}
    }else if(m.action==='add'){
      byId.set(m.mid,Object.assign({},m.fields,{id:m.mid,source:'用户补充',status:'正常'}));
    }
  });
  return Array.from(byId.values());
}
function getModsFor(id){return mods.filter(m=>m.targetId===id||m.mid===id);}

/* ---------- 冲突检测 ---------- */
function findConflicts(dateStr,startStr,endStr,excludeIds){
  const range=parseTimeRange(startStr+'-'+endStr);
  if(!range)return [];
  const res=[];
  effectiveRecords().forEach(r=>{
    if(r.date!==dateStr||r.status==='已取消'||isFree(r))return;
    if(excludeIds&&excludeIds.includes(r.id))return;
    const tr=parseTimeRange(r.time);
    if(tr&&tr[0]<range[1]&&range[0]<tr[1])res.push(r);
  });
  return res;
}

/* ---------- 状态 ---------- */
const state={selDate:fmtDate(new Date()),part:null,keyword:null,weekMode:false,tab:'day',highlightFirst:false};

/* ---------- 查询解析 ---------- */
function resolveQuery(raw){
  let s=String(raw||'').trim().replace(/\s+/g,'');
  let part=null;
  if(s.includes('上午')){part='am';s=s.replace(/上午/g,'');}
  if(s.includes('下午')){part='pm';s=s.replace(/下午/g,'');}
  const today=new Date(),monday=weekMonday(today);
  let dates=null,highlightFirst=false;
  const setOne=d=>dates=[fmtDate(d)];
  if(/^今天/.test(s)){setOne(today);s=s.replace(/^今天/,'');}
  else if(/^明天/.test(s)){setOne(addDays(today,1));s=s.replace(/^明天/,'');}
  else if(/^后天/.test(s)){setOne(addDays(today,2));s=s.replace(/^后天/,'');}
  else if(/^昨天/.test(s)){setOne(addDays(today,-1));s=s.replace(/^昨天/,'');}
  else if(/^前天/.test(s)){setOne(addDays(today,-2));s=s.replace(/^前天/,'');}
  else if(/周末/.test(s)){dates=[fmtDate(addDays(monday,5)),fmtDate(addDays(monday,6))];s=s.replace(/周末/g,'');}
  else if(/^下下(周|星期)?([一二三四五六日天])/.test(s)){setOne(addDays(monday,14+cn2idx(RegExp.$2)));s=s.replace(/^下下(周|星期)?[一二三四五六日天]/,'');}
  else if(/^下(周|星期)([一二三四五六日天])/.test(s)){setOne(addDays(monday,7+cn2idx(RegExp.$2)));s=s.replace(/^下(周|星期)[一二三四五六日天]/,'');}
  else if(/^(这|本)(周|星期)([一二三四五六日天])/.test(s)){setOne(addDays(monday,cn2idx(RegExp.$3)));s=s.replace(/^(这|本)(周|星期)[一二三四五六日天]/,'');}
  else if(/^(周|星期)([一二三四五六日天])/.test(s)){setOne(addDays(monday,cn2idx(RegExp.$2)));s=s.replace(/^(周|星期)[一二三四五六日天]/,'');}
  else if(/^第(\d+)周(周|星期)?([一二三四五六日天])/.test(s)){
    const wk=+RegExp.$1,wd=cn2idx(RegExp.$3);
    setOne(addDays(W0_DATE,wk*7+wd));s=s.replace(/^第(\d+)周(周|星期)?[一二三四五六日天]/,'');
  }
  else if(/(20\d{2})年(\d{1,2})月(\d{1,2})[日号]?/.test(s)){setOne(new Date(+RegExp.$1,+RegExp.$2-1,+RegExp.$3));s=s.replace(/(20\d{2})年(\d{1,2})月(\d{1,2})[日号]?/,'');}
  else if(/^(\d{1,2})月(\d{1,2})[日号]?/.test(s)){setOne(new Date(2026,+RegExp.$1-1,+RegExp.$2));s=s.replace(/^(\d{1,2})月(\d{1,2})[日号]?/,'');}
  else if(/^(\d{1,2})[.\/](\d{1,2})$/.test(s)){setOne(new Date(2026,+RegExp.$1-1,+RegExp.$2));s='';}
  else if(/^(这|本)周/.test(s)){dates=null;state.weekMode=true;s=s.replace(/^(这|本)周/,'');}
  else if(/^下周/.test(s)){dates=null;state.weekMode=true;state.selDate=fmtDate(addDays(monday,7));s=s.replace(/^下周/,'');}
  else if(/^上周/.test(s)){dates=null;state.weekMode=true;state.selDate=fmtDate(addDays(monday,-7));s=s.replace(/^上周/,'');}
  else if(/^下下周/.test(s)){dates=null;state.weekMode=true;state.selDate=fmtDate(addDays(monday,14));s=s.replace(/^下下周/,'');}
  if(/第一节|第一节课/.test(s)){highlightFirst=true;s=s.replace(/第一节|第一节课/g,'');}
  const keyword=s||null;
  return {dates,part,keyword,highlightFirst};
}

/* ---------- 渲染：当日 ---------- */
function renderDay(dateStr,part,keyword,highlightFirst){
  state.selDate=dateStr;state.part=part;state.keyword=keyword;state.highlightFirst=highlightFirst;
  const d=parseDateStr(dateStr);
  let recs=effectiveRecords().filter(r=>r.date===dateStr);
  const freeSlots=recs.filter(isFree);
  let active=recs.filter(isActive);
  if(part==='am')active=active.filter(r=>{const tr=parseTimeRange(r.time);return tr&&tr[0]<720;});
  if(part==='pm')active=active.filter(r=>{const tr=parseTimeRange(r.time);return tr&&tr[0]>=720;});
  if(keyword){active=active.filter(r=>[r.course,r.location,r.teacher,r.content,r.type].join(' ').includes(keyword));}
  active.sort((a,b)=>startMin(a)-startMin(b)||String(a.id).localeCompare(String(b.id)));
  const cancelled=recs.filter(r=>r.status==='已取消');
  const other=recs.filter(r=>isFree(r));

  let html='<div class="day-head">'
    +'<button class="navbtn" onclick="dayNav(-1)">‹ 前一天</button>'
    +'<div class="day-title">'+fmtCn(d)+'</div>'
    +'<button class="navbtn" onclick="dayNav(1)">后一天 ›</button></div>';

  if(active.length===0&&cancelled.length===0&&other.length===0){
    html+='<div class="card"><div class="course-name">当天没有安排课程。</div></div>';
  }else{
    if(active.length===0&&part){html+='<div class="card"><div class="course-name">该时段没有安排课程。</div></div>';}
    active.forEach((r,i)=>{
      if(highlightFirst&&i===0)html+='<div class="card" style="border-color:#2f6fed;box-shadow:0 0 0 2px rgba(47,111,237,.25)">';
      else html+='<div class="card'+(r.status==='已修改'?'':'')+'">';
      html+=renderCard(r);html+='</div>';
    });
    cancelled.forEach(r=>{html+='<div class="card cancelled">'+renderCard(r)+'</div>';});
    other.forEach(r=>{html+='<div class="card cancelled">'+renderCard(r)+'</div>';});
  }

  // 当日统计
  const stats=dayStats(active,cancelled);
  html+='<div class="stats-grid">'
    +'<div class="stat-box"><div class="k">共 '+stats.count+' 节</div><div class="v">'+stats.am+' 上午 · '+stats.pm+' 下午</div></div>'
    +'<div class="stat-box"><div class="k">第一节课</div><div class="v">'+(stats.first||'无')+'</div></div>'
    +'<div class="stat-box"><div class="k">最晚下课</div><div class="v">'+(stats.lastEnd||'无')+'</div></div>'
    +'<div class="stat-box"><div class="k">已取消</div><div class="v">'+stats.cancelled+' 节</div></div>'
    +'</div>';
  if(stats.gaps.length){
    html+='<div class="free-block">🕒 空闲时段：'+stats.gaps.map(g=>g[0]+'-'+g[1]).join('、')+'</div>';
  }
  document.getElementById('main').innerHTML=html;
  document.getElementById('dateInput').value=dateStr;
  const info='📅 '+fmtCn(d)+'';
  document.getElementById('resultInfo').textContent=info;
}
function renderCard(r){
  let badges='';
  if(r.type)badges+='<span class="badge t-'+esc(r.type)+'">'+esc(r.type)+'</span>';
  if(r.status==='已取消')badges+='<span class="badge s-已取消">已取消</span>';
  else if(r.status==='已修改')badges+='<span class="badge s-已修改">已修改</span>';
  if(r.source==='用户补充')badges+='<span class="badge s-用户补充">用户补充</span>';
  const name=r.status==='已取消'?'<span class="strike">'+esc(r.course)+'</span>':esc(r.course);
  let content=r.content?esc(r.content):'课表未提供具体课程内容。';
  if(r.note)content+='　<span style="color:#c2410c">备注：'+esc(r.note)+'</span>';
  let meta='';
  if(r.location&&r.location!=='—')meta+='📍 '+esc(r.location);
  if(r.teacher&&r.teacher!=='—')meta+=(meta?' · ':'')+'👨‍🏫 '+esc(r.teacher);
  if(!meta)meta='📍 课表未提供地点 · 👨‍🏫 课表未提供教师';
  let actions='';
  if(r.source==='用户补充'){
    actions='<button class="sm" onclick="openEdit(\''+r.id+'\')">修改</button><button class="sm danger" onclick="delAdd(\''+r.id+'\')">删除</button>';
  }else if(r.status==='已取消'){
    actions='<button class="sm" onclick="openEdit(\''+r.id+'\')">修改</button><button class="sm ok" onclick="restore(\''+r.id+'\')">恢复</button>';
  }else if(r.status==='已修改'){
    actions='<button class="sm" onclick="openEdit(\''+r.id+'\')">修改</button><button class="sm ok" onclick="restore(\''+r.id+'\')">恢复</button><button class="sm danger" onclick="cancelCourse(\''+r.id+'\')">取消</button>';
  }else{
    actions='<button class="sm" onclick="openEdit(\''+r.id+'\')">修改</button><button class="sm danger" onclick="cancelCourse(\''+r.id+'\')">取消</button>';
  }
  return '<div class="top"><span class="time-chip">'+esc(r.time||'时间待定')+'</span>'+(r.period?'<span class="period-chip">'+esc(r.period)+'</span>':'')+badges+'</div>'
    +'<div class="course-name">'+name+'</div>'
    +'<div class="meta">'+meta+'</div>'
    +'<div class="content">📖 '+content+'</div>'
    +'<div class="card-actions">'+actions+'</div>';
}
function dayStats(active,cancelled){
  const starts=active.map(r=>{const tr=parseTimeRange(r.time);return tr?tr[0]:null;}).filter(v=>v!==null);
  const ends=active.map(r=>{const tr=parseTimeRange(r.time);return tr?tr[1]:null;}).filter(v=>v!==null);
  const fmtM=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const gaps=[];
  if(starts.length>1){
    const sorted=active.filter(r=>{const tr=parseTimeRange(r.time);return tr;}).sort((a,b)=>startMin(a)-startMin(b));
    for(let i=0;i<sorted.length-1;i++){
      const a=parseTimeRange(sorted[i].time),b=parseTimeRange(sorted[i+1].time);
      if(b[0]-a[1]>=30)gaps.push([fmtM(a[1]),fmtM(b[0])]);
    }
  }
  return {count:active.length,am:active.filter(r=>{const tr=parseTimeRange(r.time);return tr&&tr[0]<720;}).length,
    pm:active.filter(r=>{const tr=parseTimeRange(r.time);return tr&&tr[0]>=720;}).length,
    first:starts.length?fmtM(Math.min(...starts)):null,lastEnd:ends.length?fmtM(Math.max(...ends)):null,
    cancelled:cancelled.length,gaps};
}

/* ---------- 渲染：本周统计 ---------- */

  const weekRecs=recs.filter(r=>{const d=parseDateStr(r.date);return d>=mon&&d<addDays(mon,7);});
  const act=weekRecs.filter(isActive);
  const starts=act.map(r=>parseTimeRange(r.time)).filter(v=>v).map(v=>v[0]);
  const fmtM=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  let byDay=[];
  for(let i=0;i<7;i++){const ds=fmtDate(addDays(mon,i));byDay.push(act.filter(r=>r.date===ds).length);}
  const maxDay=Math.max(...byDay),maxIdx=byDay.indexOf(maxDay);
  const gapsPerDay=[];
  for(let i=0;i<7;i++){
    const ds=fmtDate(addDays(mon,i));
    const dayAct=act.filter(r=>r.date===ds).sort((a,b)=>startMin(a)-startMin(b));

    +'<div class="stat-box"><div class="k">课最多的一天</div><div class="v">'+names[maxIdx]+' · '+maxDay+' 节</div></div>'
    +'<div class="stat-box"><div class="k">空闲最多的一天</div><div class="v">'+names[freeIdx]+'（'+(freeMax===0?'基本无整段空闲':'空余≥1小时 '+freeMax+' 段')+'）</div></div>'
    +'</div>';
  html+='<div style="margin:12px 0 6px;font-weight:700;font-size:14px">各天课数</div>';
  byDay.forEach((n,i)=>{
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><span style="width:44px;font-size:13px">'+names[i]+'</span>'
      +'<div style="flex:1;background:#eef2f7;border-radius:6px;height:16px;overflow:hidden"><div style="width:'+(maxDay?n/maxDay*100:0)+'%;background:#2f6fed;height:100%;border-radius:6px"></div></div>'
      +'<span style="width:30px;font-size:13px;color:#475569;text-align:right">'+n+'</span></div>';
  });
  html+='<div style="margin:12px 0 6px;font-weight:700;font-size:14px">课程分布（本周）</div>';
  if(top.length){
    html+='<div class="stats-grid">';
    top.forEach(([c,n])=>html+='<div class="stat-box"><div class="k">'+esc(c)+'</div><div class="v">'+n+' 节</div></div>');
    html+='</div>';
  }else{
    html+='<div class="card"><div class="course-name" style="color:#94a3b8;font-size:14px">本周无课程安排。</div></div>';
  }
  html+='<div style="margin:12px 0 6px;font-weight:700;font-size:14px">全学期概览</div>';
  const allAct=recs.filter(isActive);
  const allCounts={};
  allAct.forEach(r=>{allCounts[r.course]=(allCounts[r.course]||0)+1;});
  const allTop=Object.entries(allCounts).sort((a,b)=>b[1]-a[1]);
  let semesterHtml='<div class="stats-grid">';
  semesterHtml+='<div class="stat-box"><div class="k">学期课程总节数</div><div class="v">'+allAct.length+' 节</div></div>';
  const theory=allAct.filter(r=>r.type==='理论课').length;
  semesterHtml+='<div class="stat-box"><div class="k">理论课</div><div class="v">'+theory+' 节</div></div>';
  semesterHtml+='<div class="stat-box"><div class="k">实践课（见习/CBL/PBL等）</div><div class="v">'+(allAct.length-theory)+' 节</div></div>';
  semesterHtml+='<div class="stat-box"><div class="k">涉及课程门数</div><div class="v">'+allTop.length+' 门</div></div>';
  semesterHtml+='</div>';
  html+=semesterHtml;
  html+='<div style="margin:12px 0 6px;font-weight:700;font-size:14px">各课程节数（全学期）</div>';
  let listHtml='';
  allTop.forEach(([c,n],i)=>{if(i<12)listHtml+='<div style="font-size:13px;padding:3px 0;border-bottom:1px dashed #eef2f7;display:flex;justify-content:space-between"><span>'+esc(c)+'</span><span style="color:#64748b">'+n+' 节</span></div>';});
  if(!listHtml)listHtml='<div style="color:#94a3b8;font-size:13px">暂无数据</div>';
  html+=listHtml;
  document.getElementById('main').innerHTML=html;
  document.getElementById('resultInfo').textContent='📊 自动汇总本周与全学期数据（含您的修改）。';
}

/* ---------- 操作：修改/取消/恢复/删除/添加 ---------- */
function cancelCourse(id){
  const r=effectiveRecords().find(x=>x.id===id);
  if(!r)return;
  if(confirm('确认取消这节课？\n'+r.date+' '+r.time+' '+r.course)){
    mods.push({action:'cancel',targetId:id,note:'用户补充信息'});
    saveMods();refresh();
  }
}
function restore(id){
  mods.push({action:'restore',targetId:id});
  saveMods();refresh();
}
function delAdd(mid){
  mods=mods.filter(m=>m.mid!==mid);
  saveMods();refresh();
}
function openEdit(id){
  const r=effectiveRecords().find(x=>x.id===id);
  if(!r)return;
  const isAdd=r.source==='用户补充';
  const box=document.getElementById('modalBox');
  box.innerHTML='<div class="modal-title">'+(isAdd?'修改补充事件':'修改课程')+'</div>'
    +'<div class="field"><label>日期</label><input type="date" id="ed-date" value="'+r.date+'"></div>'
    +'<div class="field"><label>时间</label><input type="text" id="ed-time" value="'+esc(r.time||'')+'" placeholder="如 08:00-09:40"></div>'
    +'<div class="field"><label>节次/时段</label><input type="text" id="ed-period" value="'+esc(r.period||'')+'"></div>'
    +'<div class="field"><label>课程 / 事项</label><input type="text" id="ed-course" value="'+esc(r.course||'')+'"></div>'
    +'<div class="field"><label>类型</label><input type="text" id="ed-type" value="'+esc(r.type||'')+'"></div>'
    +'<div class="field"><label>地点</label><input type="text" id="ed-loc" value="'+esc(r.location||'')+'"></div>'
    +'<div class="field"><label>教师</label><input type="text" id="ed-teacher" value="'+esc(r.teacher||'')+'"></div>'
    +'<div class="field"><label>内容 / 备注</label><input type="text" id="ed-content" value="'+esc(r.content||'')+'"></div>'
    +'<div class="modal-actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="submitEdit(\''+id+'\')">保存修改</button></div>';
  document.getElementById('modal').classList.add('open');
}
function submitEdit(id){
  const fields={
    date:document.getElementById('ed-date').value,
    time:document.getElementById('ed-time').value.trim(),
    period:document.getElementById('ed-period').value.trim(),
    course:document.getElementById('ed-course').value.trim(),
    type:document.getElementById('ed-type').value.trim(),
    location:document.getElementById('ed-loc').value.trim(),
    teacher:document.getElementById('ed-teacher').value.trim(),
    content:document.getElementById('ed-content').value.trim()
  };
  if(!fields.date){alert('请选择日期');return;}
  if(!fields.time){alert('请填写时间');return;}
  if(!fields.course){alert('请填写课程/事项名称');return;}
  const tr=parseTimeRange(fields.time);
  if(!tr){alert('时间格式应为：08:00-09:40');return;}
  const old=effectiveRecords().find(x=>x.id===id);
  const conflicts=findConflicts(fields.date,fields.time,fields.time,old&&old.date===fields.date?[id]:[id]);
  const doSave=()=>{
    mods=mods.filter(m=>m.mid!==id&&m.targetId!==id);
    if(old&&old.source==='用户补充'){mods.push({action:'add',mid:id,fields:Object.assign({},old,fields)});}
    else{mods.push({action:'edit',targetId:id,fields,note:'用户修改'});}
    saveMods();closeModal();refresh();
  };
  if(conflicts.length){
    const box=document.getElementById('modalBox');
    const list=conflicts.map(c=>'<div>'+esc(c.time)+' '+esc(c.course)+'（'+esc(c.location||'地点未提供')+'）</div>').join('');
    box.insertAdjacentHTML('beforeend','<div class="conflict-box">⚠️ 发现时间冲突：'+list+'<div style="margin-top:8px;display:flex;gap:6px;justify-content:flex-end"><button onclick="closeModal()">放弃修改</button><button class="primary" onclick="forceEdit(\''+id+'\')">仍然保存</button></div></div>');
    window.__forceEditId=id;
    return;
  }
  doSave();
}
function forceEdit(id){
  const fields={
    date:document.getElementById('ed-date').value,
    time:document.getElementById('ed-time').value.trim(),
    period:document.getElementById('ed-period').value.trim(),
    course:document.getElementById('ed-course').value.trim(),
    type:document.getElementById('ed-type').value.trim(),
    location:document.getElementById('ed-loc').value.trim(),
    teacher:document.getElementById('ed-teacher').value.trim(),
    content:document.getElementById('ed-content').value.trim()
  };
  const old=effectiveRecords().find(x=>x.id===id);
  mods=mods.filter(m=>m.mid!==id&&m.targetId!==id);
  if(old&&old.source==='用户补充'){mods.push({action:'add',mid:id,fields:Object.assign({},old,fields)});}
  else{mods.push({action:'edit',targetId:id,fields,note:'用户修改'});}
  saveMods();closeModal();refresh();
}
function submitAdd(){
  const fields={
    date:document.getElementById('ad-date').value,
    time:document.getElementById('ad-time').value.trim(),
    period:'',
    course:document.getElementById('ad-course').value.trim(),
    type:document.getElementById('ad-type').value,
    location:document.getElementById('ad-loc').value.trim(),
    teacher:document.getElementById('ad-teacher').value.trim(),
    content:document.getElementById('ad-content').value.trim()
  };
  if(!fields.date){alert('请选择日期');return;}
  if(!fields.time){alert('请填写时间，如 15:00-16:00');return;}
  if(!fields.course){alert('请填写事项名称');return;}
  const tr=parseTimeRange(fields.time);
  if(!tr){alert('时间格式应为：15:00-16:00');return;}
  const conflicts=findConflicts(fields.date,fields.time,fields.time,[]);
  const doSave=()=>{
    const mid='a'+Date.now();
    mods.push({action:'add',mid,fields});
    saveMods();state.selDate=fields.date;refresh();
  };
  if(conflicts.length){
    if(confirm('⚠️ 发现时间冲突：\n'+conflicts.map(c=>c.time+' '+c.course).join('\n')+'\n\n仍然添加吗？')){
      doSave();
    }
    return;
  }
  doSave();
}
function closeModal(){document.getElementById('modal').classList.remove('open');}

/* ---------- 导航 ---------- */
function dayNav(n){renderDay(fmtDate(addDays(parseDateStr(state.selDate),n)),state.part,state.keyword,false);}
function goDay(ds){renderDay(ds,null,null,false);document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='day'));}
function switchTab(name){
  state.tab=name;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  if(name==='day')renderDay(state.selDate,state.part,state.keyword,state.highlightFirst);
  else if(name==='week')renderWeek(state.selDate);
  else if(name==='add')renderAdd();
  else if(name==='stats')renderStats();
}
function refresh(){switchTab(state.tab);}

/* ---------- 事件绑定 ---------- */
document.getElementById('qBtn').onclick=()=>{
  const res=resolveQuery(document.getElementById('q').value);
  state.weekMode=false;
  if(res.dates&&res.dates.length===1){
    renderDay(res.dates[0],res.part,res.keyword,res.highlightFirst);
  }else if(res.dates&&res.dates.length>1){
    // 多日期：渲染这些日期的课程列表
    renderMulti(res.dates,res.part,res.keyword);
  }else if(res.weekMode){
    renderWeek(state.selDate);
  }else if(res.keyword){
    searchAll(res.keyword);
  }else{
    renderDay(state.selDate,null,null,false);
  }
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='day'));
};
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('qBtn').click();});
document.getElementById('btnToday').onclick=()=>{renderDay(fmtDate(new Date()),null,null,false);};
document.getElementById('btnTomorrow').onclick=()=>{renderDay(fmtDate(addDays(new Date(),1)),null,null,false);};
document.getElementById('btnWeek').onclick=()=>{renderWeek(fmtDate(new Date()));switchTab('week');};
document.getElementById('dateInput').onchange=e=>{if(e.target.value)renderDay(e.target.value,null,null,false);};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};

/* ---------- 多日期 / 全局搜索 ---------- */
function renderMulti(dates,part,keyword){
  state.selDate=dates[0];
  const recs=effectiveRecords();
  const ds=new Set(dates);
  let list=recs.filter(r=>ds.has(r.date)&&r.status!=='已取消'&&isActive(r));
  if(part==='am')list=list.filter(r=>{const tr=parseTimeRange(r.time);return tr&&tr[0]<720;});
  if(part==='pm')list=list.filter(r=>{const tr=parseTimeRange(r.time);return tr&&tr[0]>=720;});
  if(keyword)list=list.filter(r=>[r.course,r.location,r.teacher,r.content,r.type].join(' ').includes(keyword));
  list.sort((a,b)=>a.date.localeCompare(b.date)||startMin(a)-startMin(b));
  let html='<div class="day-title" style="font-size:16px;font-weight:700;margin-bottom:10px">查询结果：共 '+list.length+' 节</div>';
  let cur='';
  list.forEach(r=>{
    if(r.date!==cur){
      cur=r.date;
      html+='<div style="font-weight:700;font-size:14px;margin:10px 0 6px">'+fmtCn(parseDateStr(cur))+'</div>';
    }
    html+='<div class="card">'+renderCard(r)+'</div>';
  });
  if(!list.length)html+='<div class="card"><div class="course-name" style="color:#94a3b8;font-size:14px">没有符合条件的课程。</div></div>';
  document.getElementById('main').innerHTML=html;
  document.getElementById('resultInfo').textContent='🔍 共找到 '+list.length+' 节课程。';
}
function searchAll(keyword){
  const recs=effectiveRecords();
  let list=recs.filter(r=>r.status!=='已取消'&&isActive(r)&&[r.course,r.location,r.teacher,r.content,r.type].join(' ').includes(keyword));
  list.sort((a,b)=>a.date.localeCompare(b.date)||startMin(a)-startMin(b));
  let html='<div class="day-title" style="font-size:16px;font-weight:700;margin-bottom:10px">搜索「'+esc(keyword)+'」：全学期共 '+list.length+' 节</div>';
  let cur='';
  list.forEach(r=>{
    if(r.date!==cur){cur=r.date;html+='<div style="font-weight:700;font-size:14px;margin:10px 0 6px">'+fmtCn(parseDateStr(cur))+'</div>';}
    html+='<div class="card">'+renderCard(r)+'</div>';
  });
  if(!list.length)html+='<div class="card"><div class="course-name" style="color:#94a3b8;font-size:14px">没有符合条件的课程。</div></div>';
  document.getElementById('main').innerHTML=html;
  document.getElementById('resultInfo').textContent='🔍 搜索「'+keyword+'」：共 '+list.length+' 节。';
}

/* ---------- 初始化 ---------- */
renderDay(state.selDate,null,null,false);
</script>
